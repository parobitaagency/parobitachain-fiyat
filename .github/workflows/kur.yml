name: Günlük kur kontrolü
on:
  schedule:
    - cron: '17 6 * * *'   # her gün 09:17 (TR saati)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  kur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/kur.mjs
        env:
          NTFY_TOPIC: parobitachain-kur-55eb27b582
          ESIK_YUZDE: '2'
      - name: Kuru kaydet
        run: |
          git config user.name "kur-bot"
          git config user.email "kur-bot@users.noreply.github.com"
          git add docs/rate.json
          git diff --cached --quiet || git commit -m "Kur güncellendi"
          git push
